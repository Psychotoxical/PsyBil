[package]
name = "psybil"
description = "PsyBil desktop app (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "psybil_lib"
crate-type = ["rlib"]

[[bin]]
name = "PsyBil"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.23"
chrono = "0.4.45"
psybil-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5.5"
uuid = { version = "1.29", features = ["v4", "serde"] }

[dev-dependencies]
psybil-core = { path = "../crates/core", features = ["testdata"] }
tempfile = "3.27"
