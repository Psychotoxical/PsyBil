name: main → next (RC)

# Started by hand: next takes over main (needs a green ci-ok), raises the version if the one on
# main is already released, and becomes a draft prerelease vX.Y.Z-rc.N. Publishing is done by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  channel:
    uses: ./.github/workflows/channel.yml
    with:
      channel: next
    secrets: inherit
    permissions:
      contents: write
      checks: read
