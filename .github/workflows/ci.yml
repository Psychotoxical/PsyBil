name: CI

# Every pull request needs an entry under [Unreleased] in CHANGELOG.md.
# Pull requests and pushes to main run on Linux only and only what the change needs: Lint
# always, the tests when code changes. The macOS and Windows runners (shared by every repository
# of the account) are kept for releases: packages.yml builds there and runs the tests of those
# systems first. A pull request that changes the packaging can be built by hand (Packages).
# `ci-ok` sums up the run; it is the one check main requires. Releases are built by the
# channel workflows (main → next, next → release), started by hand.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed?
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          CODE: '^(src/|src-tauri/|crates/|locales/|scripts/|index\.html$|package(-lock)?\.json$|Cargo\.(toml|lock)$|biome\.json$|tsconfig\.json$|vite\.config\.ts$|rustfmt\.toml$|\.github/workflows/ci\.yml$)'
        run: |
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
                files=ALL
              else
                files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')
              fi ;;
            *)
              files=ALL ;;
          esac
          printf '%s\n' "$files"
          code=false
          if [ "$files" = ALL ] || grep -qE "$CODE" <<< "$files"; then
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice::Tests: $code"

  changelog:
    name: Changelog entry
    # every pull request needs an entry under [Unreleased]; it becomes the next version's
    # section. Bots (Dependabot, the release sync) are exempt.
    if: github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE:CHANGELOG.md" > "$RUNNER_TEMP/base.md" 2>/dev/null || : > "$RUNNER_TEMP/base.md"
          python3 .github/release/check_changelog.py "$RUNNER_TEMP/base.md" CHANGELOG.md

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Release scripts
        run: python3 -m unittest discover -s .github/release -p "test_*.py"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend format, lint and types
        run: npm run check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  tests:
    name: Tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Linux only; the other systems test in packages.yml when a release is built
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      # cargo test writes the TypeScript types
      - name: Generated files are committed
        shell: bash
        run: git diff --exit-code -- src/ipc/bindings

  ci-ok:
    name: ci-ok
    needs: [changes, changelog, lint, tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Not green: $bad"
            exit 1
          fi
          test "$(echo "$RESULTS" | jq -r '.changes.result')" = success
