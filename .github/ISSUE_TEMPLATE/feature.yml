name: Feature request
description: An idea for something PsyBil should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        PsyBil aims to stay lean: few clicks, clear defaults, correct invoices. Ideas that make writing, issuing and keeping track of invoices simpler or safer fit best.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to get done?
      description: Describe the task or problem, not only the solution.
      placeholder: "When I write an invoice for a gig abroad, I have to ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could PsyBil help?
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Workarounds, other tools, or steps by hand.
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I searched the existing issues.
          required: true
